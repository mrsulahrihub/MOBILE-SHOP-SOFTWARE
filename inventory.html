<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — BM Mobile Zone</title>

  <!-- ✅ Inventory CSS -->
  <link rel="stylesheet" href="./inventory.css">

  <!-- Optional: Inter font for premium look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="module active" id="module-inventory">
    <div class="page-head">
      <h2>📦 Inventory</h2>
      <div class="toolbar">
        <label for="inventoryRackFilter">Filter by Rack:</label>
        <select id="inventoryRackFilter">
          <option value="">All Racks</option>
        </select>
        <button id="btnRefreshInventory" class="btn btn-ghost btn-sm">🔄 Refresh</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Low Stock / Inventory</h3>
      </div>
      <div id="lowStockTable">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <h3>Stock Movements (Last 60)</h3>
      </div>
      <div id="movementsTable">
        <div class="empty">Loading...</div>
      </div>
    </div>
  </div>

  <div style="margin-top:24px;text-align:center">
    <a href="./dashboard.html" class="btn btn-ghost">← Back to Dashboard</a>
  </div>

  <script type="module" src="./inventory.js"></script>
</body>
</html>
