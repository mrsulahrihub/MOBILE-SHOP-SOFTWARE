<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — BM Mobile Zone</title>
  <link rel="stylesheet" href="./styles.css">
  <!-- Agar aapka dashboard CSS alag file hai to woh yahan link karein -->
</head>
<body>

  <!-- ================= INVENTORY MODULE ================= -->
  <div class="module active" id="module-inventory">

    <!-- Toolbar / Header -->
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="margin:0">Inventory</h2>
      <div class="toolbar" style="display:flex;gap:10px;align-items:center">
        <label style="font-size:13px;color:#6b7896">Filter by Rack:</label>
        <select id="inventoryRackFilter" class="input" style="padding:8px 12px;border-radius:8px;border:1px solid #e6e9f2">
          <option value="">All Racks</option>
        </select>
        <button id="btnRefreshInventory" class="btn btn-ghost btn-sm">🔄 Refresh</button>
      </div>
    </div>

    <!-- Low Stock Table -->
    <div class="card">
      <div class="card-header">
        <h3>Low Stock / Inventory</h3>
      </div>
      <div id="lowStockTable">
        <div class="empty">Loading...</div>
      </div>
    </div>

    <!-- Stock Movements -->
    <div class="card" style="margin-top:20px">
      <div class="card-header">
        <h3>Stock Movements (Last 60)</h3>
      </div>
      <div id="movementsTable">
        <div class="empty">Loading...</div>
      </div>
    </div>

  </div>

  <!-- Back to Dashboard -->
  <div style="margin-top:24px;text-align:center">
    <a href="./dashboard.html" class="btn btn-ghost">← Back to Dashboard</a>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script type="module" src="./inventory.js"></script>
</body>
</html>
