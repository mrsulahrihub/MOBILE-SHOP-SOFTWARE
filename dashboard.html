<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard | BM MOBILE ZONE</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="theme-clay">

<div id="sidebarHandle" class="sidebar-handle">
  <span class="arrow-icon">›</span>
</div>

<div class="dashboard">
  <aside class="sidebar" id="mainSidebar">
    <div class="side-logo">BM <span>MOBILE ZONE</span></div>

    <p class="nav-label">WORKSPACE</p>
    <button class="nav-item active" data-module="overview" accesskey="o">▦ Overview <small>(Alt+O)</small></button>
    <button class="nav-item" data-module="products" accesskey="p">▣ Products <small>(Alt+P)</small></button>
    <button class="nav-item" data-module="inventory" accesskey="i">▤ Inventory <small>(Alt+I)</small></button>
    <button class="nav-item" data-module="racks">▦ Rack Management</button>
    <button class="nav-item" data-module="sales" accesskey="l">↗ Sales / POS <small>(Alt+L)</small></button>
    <button class="nav-item" data-module="repairing">🔧 Repairing</button>
    <button class="nav-item" data-module="purchases" accesskey="u">↙ Purchases <small>(Alt+U)</small></button>

    <p class="nav-label">PEOPLE</p>
    <button class="nav-item" data-module="customers">♙ Customers</button>
    <button class="nav-item" data-module="suppliers">♧ Suppliers</button>
    <button class="nav-item" data-module="credit">₹ Credit / Udhar</button>

    <p class="nav-label">FINANCE</p>
    <button class="nav-item" data-module="expenses" accesskey="e">▥ Expenses <small>(Alt+E)</small></button>
    <button class="nav-item" data-module="profitloss">📈 Profit & Loss</button>
    <button class="nav-item" data-module="transactions">⇄ Transactions</button>
    <button class="nav-item" data-module="reports" accesskey="r">▨ Reports <small>(Alt+R)</small></button>

    <p class="nav-label">SYSTEM</p>
    <button class="nav-item" data-module="settings">⚙ Settings</button>

    <div class="sidebar-foot">v9.0 · BM MOBILE ZONE<br>Powered by MS.TECH</div>
  </aside>

  <main class="main">
    <header class="topbar no-print">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="sub" id="todayDate"></p>
      </div>
      <div class="user-info">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-text">
          <strong id="userName">Loading...</strong>
          <small id="userRole">Checking...</small>
        </div>
        <button class="logout" id="logoutBtn" accesskey="x">Logout <small>(Alt+X)</small></button>
      </div>
    </header>

    <div class="content">
      <!-- Baaki saara HTML bilkul same rahega jo aapne diya hai -->
      <!-- (Overview, Products, Inventory, Racks, Sales, Repairing, Purchases, Customers, Suppliers, Credit, Expenses, P&L, Transactions, Reports, Settings) -->
      
      <!-- ... (HTML content paste karein jo aapne diya hai) ... -->

    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Modal</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancel (Esc)</button>
      <button class="btn btn-primary" id="modalConfirm">Save</button>
    </div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
