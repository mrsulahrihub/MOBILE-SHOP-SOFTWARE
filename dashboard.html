<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | BM MOBILE ZONE</title>
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="theme-clay">

<div id="sidebarHandle" class="sidebar-handle">
  <span class="arrow-icon">›</span>
</div>

<div class="dashboard">
  <aside class="sidebar" id="mainSidebar">
    <div class="side-logo">BM <span>MOBILE ZONE</span></div>

    <p class="nav-label">WORKSPACE</p>
    <button class="nav-item active" data-module="overview" accesskey="o">▦ Overview</button>
    <button class="nav-item" data-module="products" accesskey="p">▣ Products</button>
    <button class="nav-item" data-module="inventory" accesskey="i">▤ Inventory</button>
    <button class="nav-item" data-module="racks">▦ Rack Management</button>
    <button class="nav-item" data-module="sales" accesskey="l">↗ Sales / POS</button>
    <button class="nav-item" data-module="repairing">🔧 Repairing</button>
    <button class="nav-item" data-module="purchases" accesskey="u">↙ Purchases</button>

    <p class="nav-label">PEOPLE</p>
    <button class="nav-item" data-module="customers">♙ Customers</button>
    <button class="nav-item" data-module="suppliers">♧ Suppliers</button>
    <button class="nav-item" data-module="credit">₹ Credit / Udhar</button>

    <p class="nav-label">FINANCE</p>
    <button class="nav-item" data-module="expenses" accesskey="e">▥ Expenses</button>
    <button class="nav-item" data-module="profitloss">📈 Profit & Loss</button>
    <button class="nav-item" data-module="transactions">⇄ Transactions</button>
    <button class="nav-item" data-module="reports" accesskey="r">▨ Reports</button>

    <p class="nav-label">SYSTEM</p>
    <button class="nav-item" data-module="settings">⚙ Settings</button>

    <div class="sidebar-foot">v9.7 · BM MOBILE ZONE<br>Powered by MS.TECH</div>
  </aside>

  <main class="main">
    <header class="topbar no-print">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="sub" id="todayDate"></p>
      </div>
      <div class="user-info">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-text">
          <strong id="userName">Loading...</strong>
          <small id="userRole">Checking...</small>
        </div>
        <button class="logout" id="logoutBtn" accesskey="x">Logout (Alt+X)</button>
      </div>
    </header>

    <div class="content">
      <!-- OVERVIEW -->
      <section class="module active" id="module-overview">
        <div class="welcome clay">
          <h2>Welcome, <span id="welcomeName">User</span> 👋</h2>
          <p>BM MOBILE ZONE — Chohan Mobile Market Zafarwal · 03099100546</p>
        </div>
        <div class="stats-row" id="dashStats">
          <!-- ... Stats cards ... -->
        </div>
        <div class="clay" style="padding:24px">
          <div class="module-head"><div><h2>Recent Sales</h2><p>Last 5 sale transactions</p></div></div>
          <div class="table-wrap" id="recentSales"><div class="empty">Loading…</div></div>
        </div>
      </section>

      <!-- PRODUCTS -->
      <section class="module" id="module-products">
        <!-- ... Products module HTML ... -->
      </section>

      <!-- SALES / POS -->
      <section class="module" id="module-sales">
        <!-- ... POS module HTML ... -->
      </section>

      <!-- BAQI MODULES (Inventory, Racks, etc.) waisay hi rahenge -->
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">Modal</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancel (Esc)</button>
      <button class="btn btn-primary" id="modalConfirm">Save</button>
    </div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
